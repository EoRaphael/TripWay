<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay Contatos</title>
</head>
<body>
    <nav>
        <a href="../index.html">TripWay</a>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./destination.html">Destinos</a></li>
            <li><a href="./services.html">Pacotes</a></li>
            <li><a href="./contact.html">Nossos Contatos</a></li>
        </ul>
    </nav>

    <main>
        <section>
                <h3>Contato</h3>
                <p>Digite suas informações para entrar em contato</p>

                <form action="">
                    <div>
                        <label for="name">Nome</label>
                        <input type="text" id="name" name="name" placeholder="Digite seu nome">
                    </div>

                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu email">
                    </div>

                    <div>
                        <label for="destination">Destino de Interesse</label>
                        <input type="text" id="destination" name="destination" placeholder="Digite o destino de interesse">
                    </div>

                    <div>
                        <label for="Data">Data de Viagem</label>
                        <input type="date" id="Data" name="Data">
                    </div>

                    <div>
                        <label for="quantity">Quantidade de Viajantes</label>
                        <input type="number" id="quantity" name="quantity" placeholder="Digite a quantidade de viajantes">
                    </div>

                    <div>
                        <label for="message">Mensagem</label>
                        <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>
                    </div>

                    <button type="submit">Enviar</button>
                </form>
        </section>
    </main>
    <footer>© 2026 TripWay</footer>
</body>
</html>
